{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sinter Lab{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="{% static 'experiments/css/style.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'experiments:index' %}">Sinter Lab</a>
      <a class="btn btn-outline-secondary btn-sm" href="{% url 'admin:index' %}">Администрирование</a>
    </div>
  </nav>
  <main class="container pb-5">{% block content %}{% endblock %}</main>
  <script src="{% static 'experiments/js/charts.js' %}" defer></script>
</body>
</html>
